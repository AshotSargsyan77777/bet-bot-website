# Production stack. Requires a .env file (see .env.example) with real secrets.
# Put a TLS-terminating proxy / load balancer in front of the "web" service (port 80).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goalking}
      POSTGRES_USER: ${POSTGRES_USER:-goalking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goalking}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    env_file: .env
    environment: &prod-env
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      USE_LOCMEM_CACHE: "0"
      USE_SQLITE: "0"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: .env
    environment: *prod-env
    depends_on:
      - backend

  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment: *prod-env
    depends_on:
      - backend

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static:/srv/static:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  static:
